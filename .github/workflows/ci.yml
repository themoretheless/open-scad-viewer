name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo test --locked --manifest-path crates/Cargo.toml --workspace
      - run: python3 scripts/check-gpu-architecture.py
      - run: cargo clippy --locked --manifest-path crates/Cargo.toml -p tensor-core -p compute-core -p compute-cuda -p compute-mlx --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path crates/Cargo.toml -p osv-math --all-targets -- -D warnings

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm run test:wasm-optimize
      - run: npm run test:qualification-drift
      - run: npm run build:geometry
      - run: cargo check --locked --manifest-path crates/Cargo.toml -p tensor-core -p compute-core -p compute-mlx --target wasm32-unknown-unknown
      - run: node --import tsx benchmarks/provider-readiness.mts > provider-readiness.json
      - run: node --import tsx benchmarks/provider-readiness.mts > provider-readiness-concurrent.json
        env:
          READINESS_CONCURRENCY: '4'
      # Kernels are built above. npm lifecycle hooks would optimize/pack them
      # again before each command, despite Cargo's incremental cache.
      - run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit
      - run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.mcp.json
      # Each test worker may initialize WASM and spawn geometry subprocesses.
      # Inline projects with extends:true reload maxWorkers from the config,
      # ignoring the root CLI override. Vitest's environment override applies
      # to every resolved project, including the DOM suites.
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers 2
        env:
          VITEST_MAX_WORKERS: '2'
      - run: node node_modules/vite/bin/vite.js build
      - run: node scripts/verify-dist.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-readiness-node-${{ matrix.node-version }}
          path: |
            provider-readiness.json
            provider-readiness-concurrent.json
          if-no-files-found: warn

  native-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      # Generated artifacts and frozen source digests compare repository bytes.
      # Git for Windows must not rewrite Rust/WGSL sources during checkout.
      - name: Preserve repository line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: native-rust-cache
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm run test:wasm-optimize
      - run: npm run build:geometry
      # Hosted Windows smoke does not qualify the software DX12 adapter. An
      # unavailable Vulkan adapter exercises the existing optional-GPU skip;
      # COMPUTE_REQUIRE_GPU keeps required GPU runs fail-closed.
      - run: cargo test --locked --manifest-path crates/Cargo.toml --workspace
        env:
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'vulkan' || 'metal' }}
      - run: node node_modules/vitest/vitest.mjs run tests/duckdbModelStore.test.ts tests/mcpCli.test.ts

      # Cache compression is optional and must not consume the job budget
      # after native tests have passed (cold Windows targets can be very large).
      - name: Save native Rust cache
        if: steps.native-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: ${{ steps.native-rust-cache.outputs.cache-primary-key }}

  official-openscad-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm run build:geometry
      - run: npm run setup:openscad
      - run: npm run test:official
