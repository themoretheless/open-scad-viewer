name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    # A cold workspace build plus whole-shell proofs exceeded 40 minutes on hosted Linux.
    # Optimize test proof loops while retaining debug assertions and overflow checks.
    timeout-minutes: 90
    # Debug info in the workspace's test binaries exhausts the hosted disk
    # ("No space left on device"; ld dies with SIGBUS). Tests do not need it.
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
    steps:
      # The debug test binaries of the whole workspace plus the restored target
      # cache exhaust the hosted disk; ld then dies with SIGBUS while linking.
      - name: Free hosted runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check typed geometry without wire codecs
        run: cargo check --locked --manifest-path crates/Cargo.toml -p brep-core -p nurbs-intersect -p brep-intersect --no-default-features
      - name: Verify complete native test partition
        run: node scripts/verify-native-test-partition.mjs
      # Partition by the same name substring: every test runs in exactly one step.
      # Recognition keeps its original wall budget and runs without competing tests.
      - name: Test recognition serially
        run: cargo test --locked --manifest-path crates/Cargo.toml --workspace aag -- --test-threads=1
      - name: Test remaining native workspace cases
        run: cargo test --locked --manifest-path crates/Cargo.toml --workspace -- --skip aag
      - name: Test required manifold library and ABI smoke
        run: |
          npm run test:manifold:core
          npm run test:manifold:abi
      - name: Test manifold properties with fixed seeds
        run: npm run test:manifold:property
      - name: Test manifold properties with a random reproducible seed
        run: |
          seed="$(od -An -N8 -tu8 /dev/urandom | tr -d '[:space:]')"
          echo "MANIFOLD_PROPERTY_SEED=$seed"
          MANIFOLD_PROPERTY_SEED="$seed" npm run test:manifold:property
      - name: Fuzz malformed manifold transport with fixed seeds
        run: |
          cargo test --locked --manifest-path crates/Cargo.toml -p manifold-core --test transport_fuzz -- --nocapture
          cargo test --locked --manifest-path crates/Cargo.toml -p geometry-bridge manifold_abi_fuzz_rejects_bad_buffers_without_handle_leaks -- --nocapture
      - name: Fuzz malformed manifold transport with a random reproducible seed
        run: |
          seed="$(od -An -N8 -tu8 /dev/urandom | tr -d '[:space:]')"
          echo "MANIFOLD_PROPERTY_SEED=$seed"
          MANIFOLD_PROPERTY_SEED="$seed" cargo test --locked --manifest-path crates/Cargo.toml -p manifold-core --test transport_fuzz -- --nocapture
          MANIFOLD_PROPERTY_SEED="$seed" cargo test --locked --manifest-path crates/Cargo.toml -p geometry-bridge manifold_abi_fuzz_rejects_bad_buffers_without_handle_leaks -- --nocapture
      - name: Compare manifold booleans and metrics with manifold-3d
        working-directory: tools/manifold-bench
        run: |
          npm ci
          npm run test:differential
      - run: python3 scripts/check-gpu-architecture.py
      - run: cargo clippy --locked --manifest-path crates/Cargo.toml -p tensor-core -p compute-core -p compute-cuda -p compute-mlx --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path crates/Cargo.toml -p osv-math -p osv-math-compute --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path crates/Cargo.toml -p osv-math-compute --features gpu,tensor --all-targets -- -D warnings

  manifold-performance:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check out the comparison base
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: baseline
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
      - name: Test the rbench regression comparator
        working-directory: tools/manifold-bench
        run: npm run test:rbench
      # Both revisions run on this same machine; never compare absolute times
      # from a developer workstation with a hosted runner.
      - name: Measure base manifold kernels
        run: cargo run --quiet --locked --release --manifest-path baseline/crates/Cargo.toml -p manifold-core --example bench_manifold -- --profile quick --json --output "$RUNNER_TEMP/manifold-rbench-base"
      - name: Measure current manifold kernels
        run: cargo run --quiet --locked --release --manifest-path crates/Cargo.toml -p manifold-core --example bench_manifold -- --profile quick --json --output "$RUNNER_TEMP/manifold-rbench-current"
      - name: Block manifold performance regressions over 25 percent
        working-directory: tools/manifold-bench
        run: node rbench-regression.mjs compare --baseline "$RUNNER_TEMP/manifold-rbench-base/run.json" --current "$RUNNER_TEMP/manifold-rbench-current/run.json" --max-regression 0.25 --report "$RUNNER_TEMP/manifold-rbench-comparison.json"
      - name: Upload the manifold performance comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifold-rbench-comparison
          path: ${{ runner.temp }}/manifold-rbench-comparison.json
          if-no-files-found: warn

  check:
    runs-on: ubuntu-latest
    # The merged kernel rebuild measured 14m40 and the complete Node suite 28m49.
    # Allow cold builds and packaging; individual test deadlines/proof budgets stay fixed.
    timeout-minutes: 60
    # Bound glibc's retained allocator arenas across disposable Node workers.
    # The memory probe keeps its original 4+24 jobs and byte/slope limits.
    env:
      MALLOC_ARENA_MAX: '2'
      MALLOC_TRIM_THRESHOLD_: '0'
      MALLOC_MMAP_THRESHOLD_: '131072'
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - name: Install checksummed native Binaryen 116
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen-version_116-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 "https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz" --output "$archive"
          echo "c55b74f3109cdae97490faf089b0286d3bba926bb6ea5ed00c8c784fc53718fd  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          wasm_opt="$RUNNER_TEMP/binaryen-version_116/bin/wasm-opt"
          "$wasm_opt" --version
          echo "OSV_WASM_OPT_NATIVE=$wasm_opt" >> "$GITHUB_ENV"
          echo "OSV_TEST_WASM_OPT_NATIVE=$wasm_opt" >> "$GITHUB_ENV"
      - run: npm run test:architecture
      - run: npm run audit:architecture
      - run: npm run test:wasm-optimize
      - run: npm run test:qualification-drift
      - run: npm run build:geometry
      - name: Verify manifold exports and tetrahedron on the packaged artifact
        run: npm run test:manifold:artifact
      - name: Test required manifold TypeScript integration
        run: npm run test:manifold:ts
      - name: Compare native and WASM manifold kernels across f64 and f32
        run: node --import tsx tools/manifold-bench/environment-matrix.mts
      - name: Upload the manifold environment matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifold-environment-matrix-node-${{ matrix.node-version }}
          path: tools/manifold-bench/tmp/environment-matrix.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-kernels-node-${{ matrix.node-version }}
          path: |
            src/generated/geometry-kernels/kernel_bg.wasm
            src/generated/geometry-kernels/identity.ts
          if-no-files-found: error
      - name: Qualify current WASM graph caps and pole queries
        run: node --import tsx scripts/qualify-global-geometry.mts docs/qualification/global-geometry-2026-10-14/nonplanar-fixtures.json.gz global-geometry-wasm.json
      - run: cargo check --locked --manifest-path crates/Cargo.toml -p tensor-core -p compute-core -p compute-mlx --target wasm32-unknown-unknown
      - run: node --import tsx benchmarks/provider-readiness.mts > provider-readiness.json
      - run: node --import tsx benchmarks/provider-readiness.mts > provider-readiness-concurrent.json
        env:
          READINESS_CONCURRENCY: '4'
      # Kernels are built above. npm lifecycle hooks would optimize/pack them
      # again before each command, despite Cargo's incremental cache.
      - run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit
      - run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.mcp.json
      - name: Record disposable worker memory under the Linux allocator policy
        run: timeout 60s node --expose-gc --import tsx tests/fixtures/mcp-manifold-plan-memory-probe.ts > manifold-plan-memory.json
      # Each test worker may initialize WASM and spawn geometry subprocesses.
      # Inline projects with extends:true reload maxWorkers from the config,
      # ignoring the root CLI override. Vitest's environment override applies
      # to every resolved project, including the DOM suites.
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers 2
        env:
          VITEST_MAX_WORKERS: '2'
      - run: node node_modules/vite/bin/vite.js build
      - run: node scripts/verify-dist.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-readiness-node-${{ matrix.node-version }}
          path: |
            provider-readiness.json
            provider-readiness-concurrent.json
            manifold-plan-memory.json
          if-no-files-found: warn

  native-smoke:
    runs-on: ${{ matrix.os }}
    # Windows previously exhausted 90 minutes before the last workspace packages.
    # Fresh native geometry matrices alone took 733 + 717 seconds on the audit host.
    # Preserve every test, individual deadline and mathematical work budget.
    timeout-minutes: 150
    env:
      # Test-only optimization; release/WASM profiles and all cases stay fixed.
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      # Generated artifacts and frozen source digests compare repository bytes.
      # Git for Windows must not rewrite Rust/WGSL sources during checkout.
      - name: Preserve repository bytes and long paths on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          # Qualification evidence paths exceed the 260-character Windows limit.
          git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: native-rust-cache
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm run test:wasm-optimize
      - run: npm run build:geometry
      # Hosted Windows smoke does not qualify the software DX12 adapter. An
      # unavailable Vulkan adapter exercises the existing optional-GPU skip;
      # COMPUTE_REQUIRE_GPU keeps required GPU runs fail-closed.
      - name: Verify complete native test partition
        run: node scripts/verify-native-test-partition.mjs
      # Partition by the same name substring: every test runs in exactly one step.
      # Recognition keeps its original wall budget and runs without competing tests.
      - name: Test recognition serially
        run: cargo test --locked --manifest-path crates/Cargo.toml --workspace aag -- --test-threads=1
      - name: Test remaining native workspace cases
        run: cargo test --locked --manifest-path crates/Cargo.toml --workspace -- --skip aag
        env:
          WGPU_BACKEND: ${{ runner.os == 'Windows' && 'vulkan' || 'metal' }}
      - run: node node_modules/vitest/vitest.mjs run tests/duckdbModelStore.test.ts tests/mcpCli.test.ts

      # Cache compression is optional and must not consume the job budget
      # after native tests have passed (cold Windows targets can be very large).
      - name: Save native Rust cache
        if: steps.native-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: ${{ steps.native-rust-cache.outputs.cache-primary-key }}

  # The Node/TypeScript suite of the Linux `check` job on the other hosted
  # platforms: path separators, timer granularity, locales, symlink privileges,
  # child processes and the official runtime differ there. The Linux-only
  # allocator memory probe stays in `check`.
  node-check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      # Generated artifacts and frozen source digests compare repository bytes.
      - name: Preserve repository line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm run test:architecture
      - run: npm run audit:architecture
      - run: npm run test:qualification-drift
      - run: npm run build:geometry
      - run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit
      - run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.mcp.json
      # Hosted Windows runs the heaviest native sweep/NURBS cases in 31-36 s,
      # past the 30 s config default; explicit per-test timeouts still apply.
      - run: node node_modules/vitest/vitest.mjs run --maxWorkers 2 --testTimeout 90000
        env:
          VITEST_MAX_WORKERS: '2'
      # verify-dist stays in `check`: its byte budgets are calibrated on the
      # linux-x86_64 reference kernels, and host rustc builds differ slightly.
      - run: node node_modules/vite/bin/vite.js build
      - run: npm run setup:openscad
      - run: npm run test:official

  official-openscad-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm run build:geometry
      - run: npm run setup:openscad
      - run: npm run test:official
