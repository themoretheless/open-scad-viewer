name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo test --locked --manifest-path crates/Cargo.toml --workspace
      - run: cargo clippy --locked --manifest-path crates/Cargo.toml -p osv-math --all-targets -- -D warnings

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm run test:wasm-optimize
      - run: npm run build:geometry
      - run: node --import tsx benchmarks/provider-readiness.mts > provider-readiness.json
      # Kernels are built above. npm lifecycle hooks would optimize/pack them
      # again before each command, despite Cargo's incremental cache.
      - run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit
      - run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.mcp.json
      - run: node node_modules/vitest/vitest.mjs run
      - run: node node_modules/vite/bin/vite.js build
      - run: node scripts/verify-dist.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-readiness-node-${{ matrix.node-version }}
          path: provider-readiness.json
          if-no-files-found: warn

  native-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm run test:wasm-optimize
      - run: npm run build:geometry
      - run: cargo test --locked --manifest-path crates/Cargo.toml --workspace
      - run: node node_modules/vitest/vitest.mjs run tests/duckdbModelStore.test.ts tests/mcpCli.test.ts

  official-openscad-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/target
          key: rust-wasm-immutable-v2-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm run build:geometry
      - run: npm run setup:openscad
      - run: npm run test:official
