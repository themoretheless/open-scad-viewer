name: STEP interchange v8 qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/brep-core/**'
      - 'crates/geometry-bridge/**'
      - 'src/services/cadNurbsStep.ts'
      - 'src/services/cadStepExternalResolver.ts'
      - 'src/services/cadStepRouting.ts'
      - 'scripts/qualify-step-interchange-v8.mjs'
      - 'scripts/validate-step-ap242.mjs'
      - 'tests/fixtures/step-v*/**'
      - 'tools/step-semantic-validator-manifest.json'
      - 'tools/stepcode-ap242-ed4-manifest.json'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: dtolnay/rust-toolchain@nightly
      - run: npm ci
      - name: Build and run independent AP242 oracle
        run: node scripts/qualify-step-interchange-v8.mjs
      - name: Verify kernel and bridge certificates
        run: cargo test --locked --manifest-path crates/Cargo.toml -p brep-core -p geometry-bridge v8
      - name: Verify product adapters
        run: npm run typecheck && npm run build
      - name: Upload raw validator evidence
        uses: actions/upload-artifact@v4
        with:
          name: step-interchange-v8-evidence
          path: output/qualification/step-interchange-8-v1
          if-no-files-found: error
