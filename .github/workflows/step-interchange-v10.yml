name: STEP interchange V10
on:
  push:
    paths:
      - 'crates/brep-core/src/step_interchange_v3.rs'
      - 'crates/geometry-bridge/src/**'
      - 'src/services/cadStep*.ts'
      - 'tests/brepStepV10Product.test.ts'
      - 'scripts/qualify-step-interchange-v10.mjs'
  pull_request:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/wasm-opt*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            crates/target
          key: rust-${{ runner.os }}-wasm-opt-0.116.1-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: cargo install wasm-opt --version 0.116.1 --locked
      - run: node scripts/qualify-step-interchange-v10.mjs
