name: Native golden diagnostic only
on:
  push:
    branches: [codex/golden-numeric-audit-20261014]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2d63a3bec114041daf4cec8a789a882585d18646
          path: baseline
      - uses: actions/checkout@v6
        with:
          ref: 3c19575792ef5002fe9fb85357bd0b36075caab5
          path: current
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/registry
          key: rust-Linux-${{ hashFiles('current/crates/Cargo.lock', 'current/rust-toolchain.toml') }}
      - name: Capture unchanged numerical case payloads on one Linux host
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native-target
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' "$ImageOS/$ImageVersion" > evidence/runner.txt
          rustc -Vv > evidence/rustc.txt
          ldd --version > evidence/libc.txt
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for name in ['baseline','current']:
              root=Path(name);out=Path('evidence')/name;out.mkdir()
              shutil.copyfile(root/'crates/geometry-bridge/tests/fixtures/golden_numeric.txt',out/'original-hashes.txt')
              p=root/'crates/geometry-bridge/tests/golden_numeric.rs';s=p.read_text()
              marker='        let hash = Sha256::digest(canonical.as_bytes());'
              assert s.count(marker)==1
              s=s.replace(marker,'''        if let Some(path) = std::env::var_os("GOLDEN_AUDIT_DIR") {
                      std::fs::write(std::path::PathBuf::from(path).join(name), &canonical).unwrap();
                  }
          '''+marker)
              p.write_text(s)
          PY
          for source in baseline current; do
            CARGO_TARGET_DIR="$PWD/native-target-$source" GOLDEN_AUDIT_DIR="$PWD/evidence/$source" UPDATE_GOLDEN=1 cargo test --locked --manifest-path "$source/crates/Cargo.toml" -p geometry-bridge --test golden_numeric > "evidence/$source/test.log" 2>&1
            cp "$source/crates/geometry-bridge/tests/fixtures/golden_numeric.txt" "evidence/$source/actual-hashes.txt"
          done
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('evidence')
          results={}
          for name in ['baseline','current']:
              p=root/name
              parse=lambda f:dict(line.split() for line in (p/f).read_text().splitlines())
              original=parse('original-hashes.txt');actual=parse('actual-hashes.txt')
              results[name]={'changed':[k for k in actual if actual[k]!=original.get(k)],'cases':len(actual)}
          (root/'comparison.json').write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-golden-diagnostic-only
          path: evidence/
          retention-days: 30
