name: Native Rush snapshot diagnostic only
on:
  push:
    branches: [codex/golden-numeric-audit-20261014]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2d63a3bec114041daf4cec8a789a882585d18646
          path: baseline
      - uses: actions/checkout@v6
        with:
          ref: 6dff3e94a2b0eb56f7024d6c2faf9766f6badbf3
          path: current
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
          components: clippy
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/registry
          key: rust-Linux-${{ hashFiles('current/crates/Cargo.lock', 'current/rust-toolchain.toml') }}
      - name: Capture baseline/current Rush emitter payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' "$ImageOS/$ImageVersion" > evidence/runner.txt
          rustc -Vv > evidence/rustc.txt
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for name,crate in [('baseline','modelgraph-runtime'),('current','rush-runtime')]:
              root=Path(name)/'crates'/crate;out=Path('evidence')/name;out.mkdir()
              shutil.copyfile(root/'tests/fixtures/emitter-snapshot.tsv',out/'original-snapshot.tsv')
              p=root/'tests/emitter_snapshot.rs';s=p.read_text();marker='        let kind = &out[..out.find(\':\').unwrap()];'
              assert s.count(marker)==1
              s=s.replace(marker,'''        if let Some(path) = std::env::var_os("EMITTER_AUDIT_DIR") {
                      std::fs::write(std::path::PathBuf::from(path).join(name.replace('/', "__")), &out).unwrap();
                  }
          '''+marker);p.write_text(s)
          PY
          for source in baseline current; do
            if [[ "$source" == baseline ]]; then package=modelgraph-runtime; else package=rush-runtime; fi
            CARGO_TARGET_DIR="$PWD/native-target-$source" EMITTER_AUDIT_DIR="$PWD/evidence/$source" UPDATE_EMITTER_SNAPSHOT=1 cargo test --locked --manifest-path "$source/crates/Cargo.toml" -p "$package" --test emitter_snapshot > "evidence/$source/test.log" 2>&1
            cp "$source/crates/$package/tests/fixtures/emitter-snapshot.tsv" "evidence/$source/actual-snapshot.tsv"
          done
      - name: Check all native packages after Rush and exact Linux lint gates
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/native-target-current
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path current/crates/Cargo.toml -p rush-runtime -p sdf-core -p sketch-core -p slicer-core -p subdivision-core -p tensor-core -p value-codec -p vr-core -p wasm-brotli --no-fail-fast > evidence/remaining-native-tests.log 2>&1
          cargo clippy --locked --manifest-path current/crates/Cargo.toml -p tensor-core -p compute-core -p compute-cuda -p compute-mlx --all-targets -- -D warnings > evidence/clippy-compute.log 2>&1
          cargo clippy --locked --manifest-path current/crates/Cargo.toml -p osv-math -p osv-math-compute --all-targets -- -D warnings > evidence/clippy-math.log 2>&1
          cargo clippy --locked --manifest-path current/crates/Cargo.toml -p osv-math-compute --features gpu,tensor --all-targets -- -D warnings > evidence/clippy-math-gpu.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-rush-snapshot-diagnostic-only
          path: evidence/
          retention-days: 30
