name: Exact Windows runner rollout discovery
on:
  push:
    branches: [codex/golden-numeric-audit-20261014]
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Record actual hosted identity, zero qualification work
        shell: pwsh
        run: |
          @{imageOS=$env:ImageOS; imageVersion=$env:ImageVersion; architecture='${{ runner.arch }}'; sample=${{ matrix.sample }}; qualificationWorkUnits=0} | ConvertTo-Json | Out-File -Encoding utf8 runner.json
          Get-Content runner.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-rollout-${{ matrix.sample }}
          path: runner.json
