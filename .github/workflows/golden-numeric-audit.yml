name: Native final snapshot and fingerprint verification
on:
  push:
    branches: [codex/golden-numeric-audit-20261014]
permissions:
  contents: read
jobs:
  strict-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 394e9462d322ec433ffbab400cd1653076fc8b68
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-16
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/registry
          key: rust-Linux-${{ hashFiles('crates/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Execute the committed strict 81-case Rush snapshot
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path crates/Cargo.toml -p rush-runtime --test emitter_snapshot | tee strict-snapshot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-strict-rush-snapshot
          path: strict-snapshot.log
          retention-days: 30
  fingerprints:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 394e9462d322ec433ffbab400cd1653076fc8b68
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/materialize-qualification-kernels.mjs
      - name: Execute all 31 frozen fingerprint and qualification checks
        env:
          VITEST_MAX_WORKERS: '2'
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/vitest/vitest.mjs run tests/g0ToolchainFingerprints.test.ts tests/g1GithubActionsQualification.test.ts --maxWorkers 2 | tee fingerprints.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-source-fingerprint-checks
          path: fingerprints.log
          retention-days: 30
