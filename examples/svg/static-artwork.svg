<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="60mm" viewBox="0 0 100 60">
  <title>SVG artwork: text, CSS, reuse, clipping and gradients</title>
  <defs>
    <linearGradient id="ink" x2="1" y2="1">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <clipPath id="frame"><rect x="2" y="2" width="96" height="56" rx="8"/></clipPath>
    <path id="diamond" d="M0 -6 6 0 0 6 -6 0Z"/>
  </defs>
  <style>
    .tile { fill: url(#ink); stroke: white; stroke-width: .6; }
    text { font-family: 'Noto Sans'; text-anchor: middle; }
  </style>
  <g clip-path="url(#frame)">
    <rect width="100" height="60" fill="#eef2ff"/>
    <path fill="url(#ink)" d="M0 42Q25 26 50 42T100 42V60H0Z"/>
    <g class="tile" transform="translate(17 17)">
      <use href="#diamond"/><use href="#diamond" x="22"/>
      <use href="#diamond" x="44"/><use href="#diamond" x="66"/>
    </g>
    <text x="50" y="33" font-size="8" fill="#312e81">SVG · Привет</text>
    <path d="M10 50H90" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
  </g>
</svg>
