<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Browser-based OpenSCAD 3D viewer using WebGPU. Edit, render and view models directly in the browser." />
  <meta name="color-scheme" content="dark light" />
  <title>OpenSCAD WebGPU Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // The offline shell is a production concern. In development it would serve stale
    // modules from its cache, so any registration left over from a build is removed.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        if ('%DEV%' === 'true') {
          navigator.serviceWorker.getRegistrations()
            .then(registrations => registrations.forEach(registration => registration.unregister()))
            .catch(() => {})
          return
        }
        navigator.serviceWorker.register('/sw.js').catch(() => {})
      })
    }
  </script>
</body>
</html>
