[package]
name = "sdf-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["codec"]
codec = ["dep:value-codec", "geometry-ops/codec"]
gpu = ["dep:gpu-compute", "dep:compute-core"]
# CUDA driver-API port of the grid sampler; includes the wgpu path as fallback.
cuda = ["gpu", "gpu-compute/cuda"]

[dependencies]
math-core = { workspace = true }
compute-core = { workspace = true, optional = true }
gpu-compute = { workspace = true, optional = true }
value-codec = { workspace = true, optional = true }
geometry-ops = { workspace = true }
planar-geometry = { workspace = true }
rustc-hash = "=2.1.1"

[dev-dependencies]
rbench = { workspace = true }

[[example]]
name = "bench_sdf_cpu"
path = "examples/bench_sdf_cpu.rs"
