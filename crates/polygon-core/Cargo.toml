[package]
name = "polygon-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
math-core = { package = "osv-math", path = "../math-core" }
value-codec = { path = "../value-codec" }
geometry-ops = { path = "../geometry-ops" }
planar-geometry = { path = "../planar-geometry" }
brep-topology = { path = "../brep-topology" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
rbench = { workspace = true }

[[example]]
name = "bench_mesh_kernels"
path = "examples/bench_mesh_kernels.rs"

[[example]]
name = "bench_boolean"
path = "examples/bench_boolean.rs"
