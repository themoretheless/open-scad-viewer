[package]
name = "nurbs-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["transport"]
transport = []

[dependencies]
math-core = { package = "osv-math", path = "../math-core" }
value-codec = { path = "../value-codec" }
geometry-ops = { path = "../geometry-ops" }
cad-predicates = { path = "../cad-predicates" }

[[example]]
name = "bounded_curve_offset"
required-features = ["transport"]
