[package]
name = "sdf-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
gpu = ["dep:gpu-compute"]
# CUDA driver-API port of the grid sampler; includes the wgpu path as fallback.
cuda = ["gpu", "gpu-compute/cuda"]

[dependencies]
math-core = { package = "osv-math", path = "../math-core" }
gpu-compute = { path = "../gpu-compute", optional = true }
value-codec = { path = "../value-codec" }
geometry-ops = { path = "../geometry-ops" }
planar-geometry = { path = "../planar-geometry" }

[dev-dependencies]
rbench = { workspace = true }

[[example]]
name = "bench_sdf_cpu"
path = "examples/bench_sdf_cpu.rs"
