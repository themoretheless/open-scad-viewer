[package]
name = "cad-step"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
brep-core = { workspace = true, features = ["codec"] }
brep-topology = { workspace = true, features = ["codec"] }
nurbs-core = { workspace = true, features = ["transport", "codec"] }
sha2 = "0.11"

[dev-dependencies]
value-codec = { workspace = true }
# Kernel diagnostic examples moved here from brep-core so the kernel test build does not
# compile the STEP crate.
cad-predicates = { workspace = true }
num-rational = "0.4.2"
num-traits = "0.2.19"
