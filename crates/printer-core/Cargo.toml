[package]
name = "printer-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Live sockets: Bambu FTPS/MQTT TLS + Moonraker/OctoPrint HTTP.
network = [
    "dep:rumqttc",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:suppaftp",
    "dep:tokio",
    "dep:ureq",
]

[dependencies]
math-core = { package = "osv-math", path = "../math-core" }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", optional = true }
suppaftp = { version = "8", default-features = false, features = ["rustls-ring", "deprecated"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros"], optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
