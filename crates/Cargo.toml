[workspace]
members = ["value-codec", "math-core", "cad-predicates", "gpu-compute", "modelgraph-runtime", "modelgraph-text", "sketch-core", "geometry-ops", "planar-geometry", "brep-topology", "brep-core", "nurbs-core", "polygon-core", "gcode-core", "gcode-optimize", "printer-core", "printer-cli", "slicer-core", "mechanics-core", "openscad-core", "geometry-bridge", "geometry-wasm", "wasm-brotli", "subdivision-core", "sdf-core", "photogrammetry-core", "photogrammetry-ffi", "photogrammetry-wasm"]
resolver = "3"
exclude = ["vendor/usvg", "vendor/resvg"]

[patch.crates-io]
usvg = { path = "vendor/usvg" }
resvg = { path = "vendor/resvg" }

[workspace.package]
edition = "2024"
# Last stable Cargo accepts as rust-version. Dev/CI compile with floating nightly.
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Always the latest released rbench (moving `release` branch). Pin with `tag = "v…"` when needed.
rbench = { git = "https://github.com/themoretheless/rbench", branch = "release" }

[profile.release]
opt-level = "s"
lto = true

# Photogrammetry hot loops: measured against the size profile on native and WASM.
# Other geometry kernels retain the workspace size profile.
[profile.release.package.photogrammetry-core]
opt-level = 3

[profile.release.package.photogrammetry-ffi]
opt-level = 3

# Hot geometry kernels: measured against the workspace size profile (same
# precedent as photogrammetry-core above).
[profile.release.package.polygon-core]
opt-level = 3

# A small synchronous compression bootstrap, separate from all geometry code.
[profile.release.package.wasm-brotli]
opt-level = "z"
[profile.release.package.brotli-decompressor]
opt-level = "z"
[profile.release.package.alloc-no-stdlib]
opt-level = "z"
[profile.release.package.alloc-stdlib]
opt-level = "z"
