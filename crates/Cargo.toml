[workspace]
members = ["value-codec", "gpu-compute", "modelgraph-runtime", "modelgraph-text", "sketch-kernel", "geometry-ops", "brep-topology", "nurbs-kernel", "polygon-kernel", "geometry-bridge", "subdivision-kernel", "sdf-kernel", "photogrammetry-kernel", "photogrammetry-ffi"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true

# Photogrammetry hot loops: measured against the size profile on native and WASM.
# Other geometry kernels retain the workspace size profile.
[profile.release.package.photogrammetry-kernel]
opt-level = 3

[profile.release.package.photogrammetry-ffi]
opt-level = 3

# Hot geometry kernels: measured against the workspace size profile (same
# precedent as photogrammetry-kernel above).
[profile.release.package.polygon-kernel]
opt-level = 3



