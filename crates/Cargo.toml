[workspace]
members = ["value-codec", "math-core", "gpu-compute", "modelgraph-runtime", "modelgraph-text", "sketch-core", "geometry-ops", "planar-geometry", "brep-topology", "brep-core", "nurbs-core", "polygon-core", "gcode-core", "slicer-core", "mechanics-core", "openscad-core", "geometry-bridge", "geometry-wasm", "subdivision-core", "sdf-core", "photogrammetry-core", "photogrammetry-ffi", "photogrammetry-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[profile.release]
opt-level = "s"
lto = true

# Photogrammetry hot loops: measured against the size profile on native and WASM.
# Other geometry kernels retain the workspace size profile.
[profile.release.package.photogrammetry-core]
opt-level = 3

[profile.release.package.photogrammetry-ffi]
opt-level = 3

# Hot geometry kernels: measured against the workspace size profile (same
# precedent as photogrammetry-core above).
[profile.release.package.polygon-core]
opt-level = 3



