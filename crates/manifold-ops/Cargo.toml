[package]
name = "manifold-ops"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
manifold-core = { workspace = true }
polygon-core = { workspace = true, features = ["codec"] }
math-core = { workspace = true }
mesh-topology = { workspace = true }
mesh-query = { workspace = true }
mesh-section = { workspace = true }
subdivision-core = { workspace = true }

[dev-dependencies]
rbench = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "bench_manifold_ops"
path = "examples/bench_manifold_ops.rs"
