[package]
name = "brep-intersect"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["codec"]
codec = ["dep:value-codec", "brep-core/codec", "nurbs-intersect/codec", "nurbs-core/codec", "nurbs-core/transport"]

[dependencies]
brep-core = { workspace = true }
nurbs-intersect = { workspace = true }
nurbs-core = { workspace = true }
value-codec = { workspace = true, optional = true }

[dev-dependencies]
brep-topology = { workspace = true, features = ["codec"] }
