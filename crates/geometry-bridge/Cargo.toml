[package]
name = "geometry-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
gpu = ["dep:gpu-compute"]

[dependencies]
gpu-compute = { path = "../gpu-compute", optional = true }
value-codec = { path = "../value-codec" }
modelgraph-runtime = { path = "../modelgraph-runtime" }
modelgraph-text = { path = "../modelgraph-text" }
sketch-kernel = { path = "../sketch-kernel" }
brep-topology = { path = "../brep-topology" }
subdivision-kernel = { path = "../subdivision-kernel" }
sdf-kernel = { path = "../sdf-kernel" }
nurbs-kernel = { path = "../nurbs-kernel" }
polygon-kernel = { path = "../polygon-kernel" }
