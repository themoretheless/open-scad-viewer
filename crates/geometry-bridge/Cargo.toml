[package]
name = "geometry-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = []
gpu = ["dep:gpu-compute"]
cuda = ["gpu", "gpu-compute/cuda", "sdf-core/cuda"]

[dependencies]
math-core = { package = "osv-math", path = "../math-core" }
gpu-compute = { path = "../gpu-compute", optional = true }
value-codec = { path = "../value-codec" }
geometry-ops = { path = "../geometry-ops" }
mechanical-core = { path = "../mechanical-core" }
mechanics-core = { path = "../mechanics-core" }
sketch-core = { path = "../sketch-core" }
brep-topology = { path = "../brep-topology" }
brep-core = { path = "../brep-core" }
cad-predicates = { path = "../cad-predicates" }
planar-geometry = { path = "../planar-geometry" }
resvg = { version = "=0.47.0", default-features = false, features = ["text", "raster-images"] }
subdivision-core = { path = "../subdivision-core" }
sdf-core = { path = "../sdf-core" }
nurbs-core = { path = "../nurbs-core" }
polygon-core = { path = "../polygon-core" }
slicer-core = { path = "../slicer-core" }
usvg = { version = "0.47.0", default-features = false, features = ["text"] }
svgtypes = "0.16.1"
base64 = "0.22"
sha2 = "0.11"
data-url = "0.3"
imagesize = "0.14"
gif = "0.14.1"
image-webp = "0.2.4"
zune-jpeg = "0.5.8"
simplecss = "0.2.2"
ttf-parser = "0.25.1"

[dev-dependencies]
gcode-core = { path = "../gcode-core" }
