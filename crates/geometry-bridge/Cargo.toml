[package]
name = "geometry-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = ["languages"]
languages = ["dep:openscad-core", "dep:modelgraph-runtime", "dep:modelgraph-text"]
gpu = ["dep:gpu-compute"]

[dependencies]
math-core = { path = "../math-core" }
gpu-compute = { path = "../gpu-compute", optional = true }
value-codec = { path = "../value-codec" }
geometry-ops = { path = "../geometry-ops" }
modelgraph-runtime = { path = "../modelgraph-runtime", optional = true }
modelgraph-text = { path = "../modelgraph-text", optional = true }
sketch-core = { path = "../sketch-core" }
brep-topology = { path = "../brep-topology" }
brep-core = { path = "../brep-core" }
planar-geometry = { path = "../planar-geometry" }
subdivision-core = { path = "../subdivision-core" }
sdf-core = { path = "../sdf-core" }
nurbs-core = { path = "../nurbs-core" }
polygon-core = { path = "../polygon-core" }
openscad-core = { path = "../openscad-core", optional = true }
