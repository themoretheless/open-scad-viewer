[package]
name = "photogrammetry-ffi"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["rlib"]

# Native builds may enable the kernel's GPU stages; wasm32 stays CPU-only.
[features]
gpu = ["photogrammetry-core/gpu"]
[dependencies]
photogrammetry-core = { path = "../photogrammetry-core" }
value-codec = { path = "../value-codec" }
