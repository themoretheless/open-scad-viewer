[package]
name = "geometry-native"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "staticlib"]

# Native builds may enable the wgpu lattice stage (Metal/Vulkan).
[features]
gpu = ["geometry-bridge/gpu"]
[dependencies]
geometry-bridge = { path = "../geometry-bridge" }
