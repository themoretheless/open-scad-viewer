[package]
name = "photogrammetry-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
gpu = ["dep:gpu-compute", "dep:compute-core", "dep:math-compute", "math-compute/gpu"]
cuda = ["gpu", "math-compute/cuda"]

[dependencies]
math-core = { workspace = true }
math-compute = { workspace = true, optional = true }
compute-core = { workspace = true, optional = true }
gpu-compute = { workspace = true, optional = true }

[dev-dependencies]
rbench = { workspace = true }

[[example]]
name = "bench_matching"
path = "examples/bench_matching.rs"
