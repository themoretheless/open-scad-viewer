[package]
name = "osv-math"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Shared f64 vector helpers and typed geometry Error for open-scad-viewer kernels"
license = "MIT"
repository = "https://github.com/themoretheless/open-scad-viewer"
documentation = "https://docs.rs/osv-math"
keywords = ["geometry", "math", "vector", "linear-algebra"]
categories = ["mathematics", "science"]
publish = true

[lib]
name = "math_core"
path = "src/lib.rs"

[features]
# Portable batch vector/matrix kernels (wgpu compute shaders) for large point
# sets; the CPU reference (`transform_points`) always stays available.
gpu = ["tensor", "dep:gpu-compute", "dep:compute-core"]
# CUDA driver-API port of the batch transform kernel; includes the wgpu path
# as fallback.
cuda = ["gpu", "gpu-compute/cuda"]
# Shared resident geometry recipes; the contract crate has no native runtime.
tensor = ["dep:tensor-core"]
tensor-wgsl = ["gpu"]
tensor-cuda = ["tensor", "dep:compute-cuda"]
tensor-mlx = ["tensor", "dep:compute-mlx"]

[dependencies]
compute-core = { workspace = true, optional = true }
gpu-compute = { workspace = true, optional = true }
tensor-core = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
compute-cuda = { workspace = true, optional = true }
compute-mlx = { workspace = true, optional = true }

[dev-dependencies]
rbench = { workspace = true }

[[example]]
name = "bench_leaf_math"
path = "examples/bench_leaf_math.rs"
