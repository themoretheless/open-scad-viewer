[package]
name = "osv-math"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Shared f64 vector helpers and typed geometry Error for open-scad-viewer kernels"
license = "MIT"
repository = "https://github.com/themoretheless/open-scad-viewer"
documentation = "https://docs.rs/osv-math"
keywords = ["geometry", "math", "vector", "linear-algebra"]
categories = ["mathematics", "science"]
publish = true

[lib]
name = "math_core"
path = "src/lib.rs"

[features]
# Portable batch vector/matrix kernels (wgpu compute shaders) for large point
# sets; the CPU reference (`transform_points`) always stays available.
gpu = ["dep:gpu-compute", "dep:compute-core"]
# CUDA driver-API port of the batch transform kernel; includes the wgpu path
# as fallback.
cuda = ["gpu", "gpu-compute/cuda"]

[dependencies]
compute-core = { path = "../compute-core", optional = true }
gpu-compute = { path = "../gpu-compute", optional = true }

[dev-dependencies]
rbench = { workspace = true }

[[example]]
name = "bench_leaf_math"
path = "examples/bench_leaf_math.rs"

[[example]]
name = "bench_point_bounds"
path = "examples/bench_point_bounds.rs"

[[example]]
name = "bench_point_moments"
path = "examples/bench_point_moments.rs"

[[example]]
name = "bench_nearest_two"
path = "examples/bench_nearest_two.rs"

[[example]]
name = "bench_chamfer"
path = "examples/bench_chamfer.rs"
