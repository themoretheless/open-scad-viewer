[package]
name = "brep-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["codec"]
codec = ["dep:value-codec", "nurbs-core/codec", "brep-topology/codec", "cad-predicates/codec"]

[dependencies]
geometry-ops = { workspace = true }
value-codec = { workspace = true, optional = true }
nurbs-core = { workspace = true }
brep-topology = { workspace = true }
planar-geometry = { workspace = true }
cad-predicates = { workspace = true }
sha2 = "0.11"

[dev-dependencies]
rbench = { workspace = true }

[[example]]
name = "bench_validation"
path = "examples/bench_validation.rs"

[[example]]
name = "bench_decode"
path = "examples/bench_decode.rs"
required-features = ["codec"]

[[example]]
name = "prism-cap-probe"
required-features = ["codec"]

[[example]]
name = "ray-parity-fixtures"
required-features = ["codec"]

[[example]]
name = "shared-boundary-fixtures"
required-features = ["codec"]

[[example]]
name = "imported-prism-cap"
required-features = ["codec"]

[[example]]
name = "opposite-boundary-fixtures"
required-features = ["codec"]
